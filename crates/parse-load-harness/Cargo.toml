[package]
name = "parse-load-harness"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "parse-load-harness"
path = "src/main.rs"

[[bin]]
name = "mine-dump"
path = "bin/mine-dump.rs"

[dependencies]
api-server = { path = "../api-server", features = ["postgres"] }
common-wire = { path = "../common-wire" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots-no-provider", "multipart", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
rcgen = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "chrono", "uuid"] }
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10"
rand_chacha = "0.9"
async-trait = "0.1"
anyhow = "1"
sha2 = "0.10"
thiserror = "1"
futures = "0.3"
tempfile = "3"

[dev-dependencies]
proptest = "1"
